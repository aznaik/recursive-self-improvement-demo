<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">Agent improvement demo: implementation hierarchy</title>
  <desc id="description">One deterministic program. The command-line entry point calls the improvement loop, which uses the routing agent, a fixed evaluator, and checkpoint persistence. The audit is reported after the loop and never selects a change.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#495057" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="820" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#000000">
    <text x="50" y="64" font-size="32" font-weight="700">Implementation hierarchy</text>
    <text x="50" y="108" font-size="22">One deterministic program, not a team of autonomous LLM agents.</text>
    <g fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)">
      <polyline points="700,264 700,320"/>
      <polyline points="700,450 700,500 260,500 260,550"/>
      <polyline points="700,450 700,550"/>
      <polyline points="700,450 700,500 1140,500 1140,550"/>
    </g>
    <g id="cli">
      <rect x="460" y="150" width="480" height="114" rx="14" fill="#dee2e6" stroke="#495057" stroke-width="2"/>
      <text x="700" y="194" font-size="25" text-anchor="middle" font-weight="700">Command-line entry</text>
      <text x="700" y="234" font-size="21" text-anchor="middle">improve.py: main()</text>
    </g>
    <g id="loop">
      <rect x="420" y="320" width="560" height="130" rx="14" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
      <text x="700" y="364" font-size="25" text-anchor="middle" font-weight="700">Improvement controller</text>
      <text x="700" y="404" font-size="21" text-anchor="middle">run_loop() in improve.py</text>
      <text x="700" y="434" font-size="20" text-anchor="middle">Reflect / propose / accept / stop</text>
    </g>
    <g id="agent">
      <rect x="60" y="550" width="400" height="170" rx="14" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
      <text x="260" y="594" font-size="25" text-anchor="middle" font-weight="700">Routing agent</text>
      <text x="260" y="634" font-size="21" text-anchor="middle">agent.py: Policy + route()</text>
      <text x="260" y="668" font-size="20" text-anchor="middle">3 allowlisted Boolean settings</text>
      <text x="260" y="698" font-size="20" text-anchor="middle">Only strategy changes</text>
    </g>
    <g id="evaluator">
      <rect x="500" y="550" width="400" height="170" rx="14" fill="#a5d8ff" stroke="#1864ab" stroke-width="2"/>
      <text x="700" y="594" font-size="25" text-anchor="middle" font-weight="700">Fixed evaluator</text>
      <text x="700" y="634" font-size="21" text-anchor="middle">evaluation.py: evaluate()</text>
      <text x="700" y="668" font-size="20" text-anchor="middle">8 development + 4 guard cases</text>
      <text x="700" y="698" font-size="20" text-anchor="middle">Labels and scoring never change</text>
    </g>
    <g id="state">
      <rect x="940" y="550" width="400" height="170" rx="14" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
      <text x="1140" y="594" font-size="25" text-anchor="middle" font-weight="700">Checkpoint persistence</text>
      <text x="1140" y="634" font-size="21" text-anchor="middle">load_state() / save_state()</text>
      <text x="1140" y="668" font-size="20" text-anchor="middle">Accepted policy + full history</text>
      <text x="1140" y="698" font-size="20" text-anchor="middle">Replay validation on resume</text>
    </g>
    <text x="50" y="780" font-size="21">CLI-only audit: 6 separate cases, reported after the loop; never used to select changes.</text>
  </g>
</svg>
